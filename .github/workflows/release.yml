name: Release

# Chỉ chạy khi push lên nhánh `release`. Phát hành bản mới CHỈ khi version trong package.json chưa có tag `v<version>`;
# nếu version không đổi thì chỉ job `version` chạy rồi dừng (không build, không đăng gì).
# Workflow tự tạo release + tag `v<version>` (trỏ đúng commit vừa push) — không cần push tag thủ công.
# Cách phát hành: tăng version trong package.json trên master, rồi `git push origin master:release`.
# Job nào lỗi thì bấm "Re-run failed jobs" trên GitHub: chỉ chạy lại job đó (kết quả các job trước giữ nguyên;
# artifact content-pack/installer giữ 7 ngày để job sau dùng lại).
#
#   version ──┬─ lint ──────┐
#             ├─ typecheck ─┤
#             ├─ test ──────┼─► build ─► publish
#             └─ content-pack ┘
on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Content pack (từ điển ~21 MB) không nằm trong git: tải từ release có tag này (xem docs/15-packaging-and-release.md §6)
  CONTENT_PACK_TAG: content-pack-1.5.0

jobs:
  version:
    name: Kiểm tra version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.ver.outputs.release }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: So version với tag hiện có
        id: ver
        run: node scripts/release/check-version.mjs

  lint:
    name: Lint
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Test
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  content-pack:
    name: Content pack
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Tải và kiểm tra sha256
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p content/packs
          gh release download "$CONTENT_PACK_TAG" --pattern 'core-dictionary-*' --dir content/packs --clobber || {
            echo "::error::Không tải được content pack từ release '$CONTENT_PACK_TAG'. Tải lên một lần (xem docs/15-packaging-and-release.md §6)."
            exit 1
          }
          cd content/packs
          for f in *.eapack.sha256; do sha256sum -c "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: content-pack
          path: content/packs/
          retention-days: 7

  build:
    name: Build installer
    needs: [version, lint, typecheck, test, content-pack]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: content-pack
          path: content/packs
      - run: pnpm build:win
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          # latest.yml + .blockmap là thứ electron-updater đọc để cập nhật tự động
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Tạo release + tag
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # tạo release/tag và tải file lên
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      - name: Tạo release và tải file lên
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest
