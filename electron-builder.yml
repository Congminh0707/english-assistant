appId: net.gonbi.englishassistant
productName: English Assistant
directories:
  buildResources: build
# Chỉ đóng gói code đã build (out/) — node_modules production + package.json được electron-builder tự thêm.
# Dùng danh sách CHO PHÉP thay vì loại trừ để không vô tình cuốn theo content/, docs/, .claude/worktrees...
files:
  - out/**/*
  - '!**/*.map'
  # onnxruntime-node có binary cho mọi nền tảng (~280 MB): chỉ giữ Windows x64
  - '!**/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!**/onnxruntime-node/bin/napi-v6/linux/**'
  - '!**/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  # onnxruntime-web (~120 MB, bản chạy trong trình duyệt) không dùng khi chạy bằng onnxruntime-node
  - '!**/onnxruntime-web/**'
  # kokoro-js kèm giọng nhiều ngôn ngữ (~28 MB): chỉ giữ giọng tiếng Anh (af_, am_, bf_, bm_)
  - '!**/kokoro-js/voices/[!ab]*.bin'
asarUnpack:
  - resources/**
  # Thư viện native phải nằm ngoài asar để nạp được
  - '**/onnxruntime-node/**'
  - '**/@img/**'
  - '**/sharp/**'
  # Giọng đọc đọc file giọng/WASM từ đĩa
  - '**/kokoro-js/**'
  - '**/phonemizer/**'
extraResources:
  # File SQL migration của user.db, đọc lúc khởi động (src/main/core/paths.ts)
  - from: src/main/db/migrations
    to: migrations
  # Gói nội dung đi kèm (từ điển...). Phải build trước bằng pipeline: pnpm content:fetch/normalize/build
  - from: content/packs
    to: packs
    filter: ['*.eapack']
win:
  executableName: english-assistant
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Cập nhật tự động qua GitHub Releases (electron-updater đọc latest.yml + .blockmap). Phát hành: GH_TOKEN=... pnpm release:win
publish:
  provider: github
  owner: Congminh0707
  repo: english-assistant
  releaseType: release
