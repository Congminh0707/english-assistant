<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kids pictures trial</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #eef6ff;
        font-family: system-ui, sans-serif;
        color: #3b2a3a;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, 200px);
        gap: 16px;
      }
      .card {
        background: #fff;
        border-radius: 20px;
        padding: 8px;
        text-align: center;
        box-shadow: 0 2px 0 #d6e4f5;
      }
      .card canvas {
        display: block;
        margin: 0 auto;
      }
      .small {
        display: flex;
        gap: 8px;
        justify-content: center;
        align-items: end;
        margin-top: 4px;
      }
      .label {
        font-weight: 700;
        font-size: 15px;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <h1>Thử 10 hình vector (canvas) — 184px và 64px</h1>
    <div class="grid" id="grid"></div>
    <script src="art.js"></script>
    <script>
      const grid = document.getElementById('grid')
      for (const [id, paint] of Object.entries(PICS)) {
        const card = document.createElement('div')
        card.className = 'card'
        card.appendChild(render(paint, 184))
        const small = document.createElement('div')
        small.className = 'small'
        small.appendChild(render(paint, 64))
        card.appendChild(small)
        const l = document.createElement('div')
        l.className = 'label'
        l.textContent = id
        card.appendChild(l)
        grid.appendChild(card)
      }
    </script>
  </body>
</html>
