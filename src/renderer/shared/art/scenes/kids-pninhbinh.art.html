@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

.walk{animation:bob .7s ease-in-out infinite}
.next{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
