<style>:host{display:block;overflow:hidden}svg{display:block;width:100%;height:100%}</style><style>
:root{--bg:#FBEFD8;--surface:#FFF9EA;--surface2:#F6E6C4;--line:#E7C98E;--ink:#3A2413;--inkSoft:#6B4A30;--primary:#D32F2F;--primarySoft:#FBE0DA;--success:#0B7A52;--successSoft:#D9F5E4;--warning:#8F5A06;--warningSoft:#FFE9B8;--danger:#9E1B1F;--dangerSoft:#FBE3E3;--xp:#0E7C8C;--xpSoft:#D4F3F2;--coin:#F7B91A;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-pill:999px;--shadow:0 1px 2px rgba(43,43,58,.06),0 1px 3px rgba(43,43,58,.08)}
.dark{--bg:#141A3A;--surface:#1F2750;--surface2:#2A3364;--line:#3D4880;--ink:#FFF3D6;--inkSoft:#C9CDEE;--primary:#F7B91A;--primarySoft:#3E3420;--success:#6BCB8F;--successSoft:#1F4034;--warning:#EDBB5C;--warningSoft:#4A3B1E;--danger:#EE8A8A;--dangerSoft:#4D2A2E;--xp:#7FE3E0;--xpSoft:#1F4650;--coin:#F7B91A}

.t{font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);box-sizing:border-box}
.t *{box-sizing:border-box}
.h1,.h2,.h3{font-family:'Be Vietnam Pro',sans-serif;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}
.h1{font-size:32px}.h2{font-size:26px}.h3{font-size:20px}
.soft{color:var(--inkSoft)}.sm{font-size:13px}.xs{font-size:12px}
.ipa{font-family:'Noto Sans',sans-serif}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:16px}
.row{display:flex;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:var(--r-pill);border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px 'Be Vietnam Pro',sans-serif;cursor:pointer;white-space:nowrap}
.btn--primary{background:var(--primary);border-color:var(--coin);color:#fff}
.btn--success{background:var(--success);border-color:var(--success);color:#fff}
.btn--danger{color:var(--danger);border-color:var(--danger)}
.btn--ghost{background:transparent;border-color:transparent}
.btn--icon{width:36px;padding:0}
.btn--xs{height:28px;padding:0 12px;font-size:13px}
.dark .btn--primary,.dark .btn--success{color:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 12px;border-radius:var(--r-pill);font:700 12px 'Be Vietnam Pro',sans-serif;background:var(--surface2);color:var(--inkSoft)}
.chip--primary{background:var(--primarySoft);color:var(--primary)}.chip--success{background:var(--successSoft);color:var(--success)}
.chip--warning{background:var(--warningSoft);color:var(--warning)}.chip--danger{background:var(--dangerSoft);color:var(--danger)}.chip--xp{background:var(--xpSoft);color:var(--xp)}
.bar{height:8px;border-radius:var(--r-pill);background:var(--surface2);overflow:hidden}.bar>i{display:block;height:100%;border-radius:var(--r-pill);background:var(--primary)}
.input{height:36px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);padding:0 12px;display:flex;align-items:center;color:var(--inkSoft)}
.item{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface)}
.side{width:216px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:var(--r-md);color:var(--inkSoft);font-weight:600}
.nav.on{background:var(--primarySoft);color:var(--primary)}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:var(--r-md);background:var(--surface2)}
.tab{display:flex;align-items:center;gap:8px;height:28px;padding:0 12px;border-radius:var(--r-sm);font-weight:600;font-size:13px;color:var(--inkSoft);white-space:nowrap}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.grow{flex:1;min-width:0}
.clip{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:.8}}
@keyframes sway{0%,100%{transform:rotate(-1.3deg)}50%{transform:rotate(1.6deg)}}
@keyframes fly{0%{transform:translate(-160px,20px)}50%{transform:translate(560px,-16px)}100%{transform:translate(1280px,24px)}}

@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(1320px)}}

@keyframes wing2{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(15deg)}}
@keyframes cbob{0%,100%{transform:translateY(-1px)}50%{transform:translateY(2px)}}
@keyframes lap{0%,100%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
@keyframes tail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(9deg)}}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(7deg)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}

.cw{animation:wing 2.8s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:0 0}
.cw2{animation:wing2 2.8s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:0 0}
.cbody{animation:cbob 2.8s ease-in-out infinite;animation-delay:var(--d,0s)}
.lap{animation:lap var(--t,5s) ease-in-out infinite;animation-delay:var(--d,0s)}
.tl{animation:tail 2.2s ease-in-out infinite;transform-origin:0 0}
.spin{animation:spin 90s linear infinite;transform-origin:0 0}
.halo{animation:glow 4s ease-in-out infinite}
.sway{animation:sway var(--t,5s) ease-in-out infinite;animation-delay:var(--d,0s)}
.fly{animation:fly var(--t,52s) linear infinite;animation-delay:var(--d,0s)}
.flap{animation:flap .7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.drift{animation:drift var(--t,90s) linear infinite;animation-delay:var(--d,0s)}
.flow{animation:flow 5s linear infinite}
.rock{animation:rock 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.smoke{animation:smoke 4s ease-out infinite;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
.wave{animation:wave 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.tw{animation:twinkle var(--t,3s) ease-in-out infinite;animation-delay:var(--d,0s)}
.ff{animation:fire var(--t,2.4s) ease-in-out infinite;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){.cw,.cw2,.cbody,.lap,.tl,.spin,.halo,.sway,.fly,.flap,.drift,.flow,.rock,.smoke,.wave,.tw,.ff{animation:none}}
